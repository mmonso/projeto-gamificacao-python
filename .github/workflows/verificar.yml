# Verificações a cada envio e pull request (E04.8; ESPECIFICACAO_MVP, F-40).
name: Verificar

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tipos, lint, testes e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      # Inclui os testes de integração com PostgreSQL embutido (PGlite) e a publicação do conteúdo.
      - run: npm test
      - run: npm run build
        env:
          # Valores fictícios: o build não acessa o Supabase nem o banco.
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_exemplo

  conteudo:
    name: Conteúdo (formato e exemplos em Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ferramentas/requirements.txt
      - run: pip install -r ferramentas/requirements.txt
      - name: Verificar unidades
        run: |
          for unidade in conteudo/unidade-*/; do
            python ferramentas/verificar_conteudo.py "$unidade"
          done

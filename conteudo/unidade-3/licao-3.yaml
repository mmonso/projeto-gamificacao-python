  - id: u3-l3-r03
    versao: 1
    variacao_de: u3-l3-e04
    tipo: escolher_resultado
    objetivo: Prever and com uma condição falsa.
    conceitos: [logicos, booleanos]
    dificuldade: 2
    enunciado: O que este programa exibe?
    codigo: |-
      idade = 25
      tem_carteira = False
      print(idade >= 18 and tem_carteira)
    opcoes_sao: saida
    opcoes:
      - id: a
        texto: |-
          True
        feedback: tem_carteira é False, e o and exige os dois verdadeiros.
      - id: b
        texto: |-
          False
      - id: c
        texto: |-
          25
        feedback: O and resulta em um valor lógico.
    resposta: b
    dicas:
      - Avalie cada lado do and.
      - Com and, basta um dos lados ser False para o resultado inteiro ser False.
    explicacao: idade >= 18 é True, mas tem_carteira é False. Com and, o resultado é False.

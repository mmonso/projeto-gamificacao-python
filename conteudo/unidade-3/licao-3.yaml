  - id: u3-l3-r02
    versao: 1
    variacao_de: u3-l3-e03
    tipo: escolher_resultado
    objetivo: Inverter False com not.
    conceitos: [logicos]
    dificuldade: 1
    enunciado: O que este programa exibe?
    codigo: |-
      print(not False)
    opcoes_sao: saida
    opcoes:
      - id: a
        texto: |-
          True
      - id: b
        texto: |-
          False
        feedback: O not inverte o valor.
      - id: c
        texto: |-
          not False
        feedback: Sem aspas, o Python calcula o resultado.

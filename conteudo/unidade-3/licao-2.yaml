  - id: u3-l2-r03
    versao: 1
    variacao_de: u3-l2-e06
    tipo: escolher_resultado
    objetivo: Comparar número com texto em outro contexto.
    conceitos: [igualdade, booleanos]
    dificuldade: 3
    enunciado: O que este programa exibe?
    codigo: |-
      print(1 == "1")
    opcoes_sao: saida
    opcoes:
      - id: a
        texto: |-
          False
      - id: b
        texto: |-
          True
        feedback: Número e texto não são iguais, mesmo com o mesmo algarismo.
      - id: c
        erro: true
        feedback: O == aceita tipos diferentes e responde False.
    resposta: a
    dicas:
      - Um lado tem aspas e o outro não.
    explicacao: 1 é número e "1" é texto. Como os tipos são diferentes, o == responde False.

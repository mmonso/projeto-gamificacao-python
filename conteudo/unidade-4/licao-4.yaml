  - id: u4-l4-r02
    versao: 1
    variacao_de: u4-l4-e03
    tipo: escolher_resultado
    objetivo: Perceber que todas as linhas recuadas se repetem a cada volta.
    conceitos: [for]
    dificuldade: 2
    enunciado: As duas linhas do bloco estão recuadas. O que este programa exibe?
    codigo: |-
      for numero in [5, 6]:
          print(numero)
          print("ok")
    opcoes_sao: saida
    opcoes:
      - id: a
        texto: |-
          5
          ok
          6
          ok
      - id: b
        texto: |-
          5
          6
          ok
        feedback: O print("ok") está recuado, então se repete a cada volta.
      - id: c
        texto: |-
          5
          6
        feedback: O bloco tem dois print, e os dois rodam a cada volta.
    resposta: a
    dicas:
      - Quais linhas estão dentro do for?
      - "Todas as linhas recuadas formam o bloco e rodam juntas, na ordem, a cada volta do for."
    explicacao: Os dois print estão recuados, então rodam juntos a cada volta. Primeiro com 5, depois com 6.

  - id: u4-l4-r03
    versao: 1
    variacao_de: u4-l4-e05
    tipo: localizar_erro
    objetivo: Encontrar o bloco do for sem recuo em outro contexto.
    conceitos: [for]
    dificuldade: 2
    enunciado: Este programa mostra um erro. Selecione a linha com o problema.
    codigo: |-
      for nome in ["Lia", "Davi"]:
      print("Olá,", nome)
    erro: IndentationError
    resposta: 2
    correcao: '    print("Olá,", nome)'
    saida_esperada: |-
      Olá, Lia
      Olá, Davi
    dicas:
      - Repare no recuo da linha de baixo do for.
      - "Toda linha do bloco do for fica recuada com quatro espaços, logo abaixo da linha que termina com dois-pontos."
    explicacao: A linha 2 é o bloco do for e precisa de recuo. Sem ele, o Python mostra um erro de indentação.

  - id: u4-l2-r02
    versao: 1
    variacao_de: u4-l2-e03
    tipo: escolher_resultado
    objetivo: Pegar o último valor com -1 numa lista de números.
    conceitos: [indice]
    dificuldade: 2
    enunciado: O que este programa exibe?
    codigo: |-
      precos = [5, 8, 12]
      print(precos[-1])
    opcoes_sao: saida
    opcoes:
      - id: a
        texto: |-
          5
        feedback: -1 conta do fim da lista, não do começo.
      - id: b
        texto: |-
          12
      - id: c
        texto: |-
          -12
        feedback: O -1 é uma posição; o valor guardado nela continua positivo.
    resposta: b
    dicas:
      - Com o sinal de menos, a posição conta a partir do fim.
      - "A posição -1 guarda sempre o último valor: em [\"a\", \"b\"], [-1] é \"b\"."
    explicacao: A posição -1 é o último valor da lista, o 12.


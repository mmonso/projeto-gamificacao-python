id: u1
versao: 1
ordem: 1
titulo: Primeiros comandos
descricao: Exiba mensagens, números e valores guardados em variáveis.
conceitos:
  - id: print-texto
    nome: Exibir texto com print
    descricao: O comando print exibe na tela o texto escrito entre aspas, sem as aspas.
    cartao:
      regra: "O print mostra na tela o texto que está entre as aspas."
      exemplo: "print(\"Pedido recebido\")"
      saida: "Pedido recebido"
      destaque: "print"
      repare: "Nem o comando print nem as aspas aparecem na tela."
      primeiro: "u1-l1-e01"
  - id: string-aspas
    nome: Texto entre aspas
    descricao: Todo texto precisa de aspas iguais no início e no fim; sem aspas, o Python procura um nome.
    cartao:
      regra: "Todo texto precisa de aspas no início e no fim: elas marcam onde ele começa e termina."
      exemplo: "print(\"Até amanhã!\")"
      saida: "Até amanhã!"
      destaque: "\"Até amanhã!\""
      repare: "Sem a aspa do fim, o Python mostra erro: não sabe onde o texto termina."
      primeiro: "u1-l1-e01"
  - id: ordem-execucao
    nome: Ordem de execução
    descricao: As linhas são executadas de cima para baixo, e cada print exibe uma nova linha.
    cartao:
      regra: "O Python executa as linhas de cima para baixo. Cada print mostra uma linha nova."
      exemplo: "print(\"Ligar o forno\")\nprint(\"Assar o bolo\")\nprint(\"Servir\")"
      saida: "Ligar o forno\nAssar o bolo\nServir"
      repare: "Dois print seguidos não ficam na mesma linha: cada um começa uma nova."
      primeiro: "u1-l1-e03"
  - id: print-numero
    nome: Números e contas no print
    descricao: Números são escritos sem aspas, e o print exibe o resultado de uma conta.
    cartao:
      regra: "Números vão sem aspas. Com uma conta, o print mostra o resultado."
      exemplo: "print(8)\nprint(6 + 7)\nprint(20 - 9)"
      saida: "8\n13\n11"
      destaque: "6 + 7"
      repare: "Sem aspas, o + soma: 6 + 7 vira 13, e não 67."
      primeiro: "u1-l2-e01"
  - id: texto-vs-numero
    nome: Texto ou número
    descricao: Uma conta entre aspas é apenas texto e é exibida como foi escrita.
    cartao:
      regra: "Sem aspas, o Python faz a conta. Entre aspas, é texto e aparece como foi escrito."
      exemplo: "print(7 + 1)\nprint(\"7 + 1\")"
      saida: "8\n7 + 1"
      destaque: "\"7 + 1\""
      repare: "As aspas não aparecem na tela, mas mudam o resultado."
      primeiro: "u1-l2-e02"
  - id: print-varios
    nome: Vários valores no print
    descricao: Valores separados por vírgula no print são exibidos na mesma linha, separados por espaço.
    cartao:
      regra: "Valores separados por vírgula no print saem na mesma linha, com um espaço entre eles."
      exemplo: "print(\"Andar:\", 7)\nprint(\"Mesa\", 4, \"livre\")"
      saida: "Andar: 7\nMesa 4 livre"
      destaque: "\"Andar:\", 7"
      repare: "A vírgula não aparece na tela; no lugar dela, o print põe um espaço."
      primeiro: "u1-l2-e04"
  - id: atribuicao
    nome: Criar variáveis
    descricao: O sinal = guarda o valor da direita no nome da esquerda.
    cartao:
      regra: "O = cola um nome no valor da direita, como uma etiqueta. O print desse nome mostra o valor."
      exemplo: "bebida = \"suco\"\ncopos = 2\nprint(bebida, copos)"
      saida: "suco 2"
      destaque: "bebida = \"suco\""
      repare: "Use um = só. O nome fica à esquerda e o valor, à direita."
      primeiro: "u1-l3-e01"
  - id: variavel-vs-texto
    nome: Variável ou texto
    descricao: Sem aspas, um nome é uma variável; com aspas, é um texto. Usar um nome que não existe gera NameError.
    cartao:
      regra: "Sem aspas, um nome é uma variável e mostra o valor dela. Com aspas, é só texto."
      exemplo: "bairro = \"Centro\"\nprint(bairro)\nprint(\"bairro\")"
      saida: "Centro\nbairro"
      destaque: "\"bairro\""
      repare: "Um nome sem aspas que nunca recebeu valor gera NameError."
      primeiro: "u1-l3-e02"
  - id: nomes-variaveis
    nome: Nomes de variáveis
    descricao: Nomes não têm espaços, não começam com número, e maiúsculas e minúsculas fazem diferença.
    cartao:
      regra: "Nomes usam letras, números e _, sem espaços e sem começar com número. Maiúsculas fazem diferença."
      exemplo: "meta_diaria = 3\nMeta_diaria = 9\nprint(meta_diaria, Meta_diaria)"
      saida: "3 9"
      destaque: "Meta_diaria = 9"
      repare: "Mudar uma maiúscula já muda o nome. Usar um nome que não existe gera NameError."
      primeiro: "u1-l3-e04"
  - id: reatribuicao
    nome: Trocar o valor de uma variável
    descricao: Uma nova atribuição substitui o valor anterior; cada linha usa o valor do momento em que é executada.
    cartao:
      regra: "Uma nova atribuição move a etiqueta: o nome passa a valer o novo valor, a partir daquela linha."
      exemplo: "lugar = \"praia\"\nprint(lugar)\nlugar = \"serra\"\nprint(lugar)"
      saida: "praia\nserra"
      destaque: "lugar = \"serra\""
      repare: "O nome não fica com os dois valores: vale o último atribuído."
      primeiro: "u1-l4-e01"
  - id: atualizacao
    nome: Atualizar uma variável
    descricao: Em pontos = pontos + 5, o Python calcula com o valor atual e guarda o resultado no mesmo nome.
    cartao:
      regra: "O Python calcula primeiro o lado direito, com o valor atual, e o nome passa a valer o resultado."
      exemplo: "gols = 2\ngols = gols + 1\nprint(gols)"
      saida: "3"
      destaque: "gols = gols + 1"
      repare: "Aqui o = não é o igual da matemática: quer dizer passa a valer."
      primeiro: "u1-l4-e03"
